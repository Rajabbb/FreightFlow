<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komandaya qoşul | Arachi</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/arachi-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #0037B8; --brand-2: #2F63E0; --tint: #E7EEFF; --line: #DCE4F7; --text: #0B1433; --muted: #56627F; --ok: #12A06E; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 24px 12px;
            background: radial-gradient(900px 480px at 100% -10%, rgba(77, 124, 242, 0.12), transparent 65%), #F6F8FE;
        }
        .card-box { background: #fff; border-radius: 26px; padding: 36px; width: 100%; max-width: 520px; border: 1px solid var(--line); box-shadow: 0 30px 60px -36px rgba(0, 55, 184, 0.5); }
        .logo { height: 44px; width: 44px; object-fit: cover; border-radius: 13px; }
        .form-label { font-weight: 600; font-size: 13px; }
        .form-control { padding: 11px 14px; border-radius: 13px; border: 1px solid var(--line); background: #F8FAFF; font-size: 14px; font-weight: 500; }
        .form-control:focus { background: #fff; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(0, 55, 184, 0.10); }
        .btn-primary { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); border: none; padding: 13px; border-radius: 14px; font-weight: 700; }
        .btn-primary:disabled { background: linear-gradient(135deg, #7F96D6, #9AB0EA); }
        .invite-box { background: var(--tint); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; }
        @media (max-width: 576px) { .card-box { padding: 24px 18px; border-radius: 22px; } }
    </style>
</head>
<body>
    <div class="card-box">
        <div class="text-center mb-4">
            <img src="/static/arachi-logo.png" alt="Arachi" class="logo" onerror="this.style.display='none'">
            <h4 class="fw-bold mt-3 mb-1">Komandaya qoşulun</h4>
            <p class="text-muted small mb-0">Dəvətlə qoşulursunuz. Hesabınız öz e-poçtunuz və şifrənizlə olacaq.</p>
        </div>

        <input type="hidden" id="token" value="{{ token }}">
        <div id="loading" class="text-center text-muted small">Dəvət yoxlanılır...</div>
        <div id="invalid" class="alert alert-danger d-none"></div>

        <form id="joinForm" class="d-none" onsubmit="submitJoin(event)" novalidate>
            <div class="invite-box mb-4">
                <div><b id="companyName"></b> şirkətinin Arachi hesabına dəvət olunmusunuz.</div>
                <div class="text-muted mt-1">E-poçt: <span id="inviteEmail"></span></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="name">Adınız və soyadınız</label>
                <input type="text" class="form-control" id="name" maxlength="100" required autocomplete="name" placeholder="Məs: Əli Quliyev">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Şifrə təyin edin</label>
                <input type="password" class="form-control" id="password" required autocomplete="new-password" placeholder="••••••••">
                <small class="text-secondary d-block mt-2" style="font-size: 11px;"><strong>Tələb olunur:</strong> ən azı 8 simvol, 1 böyük hərf, 1 kiçik hərf və 1 rəqəm.</small>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="accept_terms">
                <label class="form-check-label small text-secondary" for="accept_terms">
                    <a href="/static/terms.html" target="_blank" rel="noopener" class="fw-semibold text-decoration-none" style="color: var(--brand);">İstifadə Şərtləri</a>
                    və
                    <a href="/static/privacy.html" target="_blank" rel="noopener" class="fw-semibold text-decoration-none" style="color: var(--brand);">Məxfilik Siyasəti</a>
                    ilə tanış oldum və razıyam.
                </label>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Komandaya qoşul</button>
            <div id="errorMsg" class="text-danger small mt-3 text-center d-none"></div>
        </form>

        <div id="done" class="d-none text-center">
            <div class="alert alert-success">Komandaya qoşuldunuz!</div>
            <a href="/login" class="btn btn-primary w-100">Daxil ol</a>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        let token = ($('token').value || '').trim();
        if (token.indexOf('{{') !== -1) token = '';
        if (!token) {
            try { token = new URLSearchParams(location.search).get('token') || ''; } catch (e) {}
        }

        function showInvalid(msg) {
            $('loading').classList.add('d-none');
            $('invalid').textContent = msg;
            $('invalid').classList.remove('d-none');
        }

        async function loadInvite() {
            if (!token) { showInvalid('Dəvət linki düzgün deyil.'); return; }
            try {
                const res = await fetch('/api/team/invite-info?token=' + encodeURIComponent(token));
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { showInvalid(typeof data.detail === 'string' ? data.detail : 'Dəvət linki etibarsızdır.'); return; }
                $('companyName').textContent = data.company_name || 'Şirkət';
                $('inviteEmail').textContent = data.email || '';
                if (data.name) $('name').value = data.name;
                $('loading').classList.add('d-none');
                $('joinForm').classList.remove('d-none');
            } catch (e) {
                showInvalid('Sistemlə əlaqə kəsildi. İnterneti yoxlayın.');
            }
        }

        async function submitJoin(e) {
            e.preventDefault();
            const btn = $('submitBtn'), err = $('errorMsg');
            const fail = m => { err.textContent = m; err.classList.remove('d-none'); btn.disabled = false; btn.textContent = 'Komandaya qoşul'; };
            const name = $('name').value.trim(), password = $('password').value;
            if (!name) { fail('Adınızı yazın.'); return; }
            if (!/^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/.test(password)) { fail('Şifrə ən azı 8 simvol, 1 böyük hərf, 1 kiçik hərf və 1 rəqəm olmalıdır.'); return; }
            if (!$('accept_terms').checked) { fail('Davam etmək üçün İstifadə Şərtləri və Məxfilik Siyasəti ilə razılaşmalısınız.'); return; }
            btn.disabled = true; btn.textContent = 'Gözləyin...'; err.classList.add('d-none');
            try {
                const res = await fetch('/api/team/join', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, name: name, password: password, accepted_terms: true })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    $('joinForm').classList.add('d-none');
                    $('done').classList.remove('d-none');
                } else {
                    fail(typeof data.detail === 'string' ? data.detail : 'Xəta baş verdi.');
                }
            } catch (e2) {
                fail('Sistemlə əlaqə kəsildi. İnterneti yoxlayın.');
            }
        }

        loadInvite();
    </script>
</body>
</html>
