<script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function loadRequestDetails() {
            try {
                const response = await fetch(`/requests/details/${token}`);
                const data = await response.json();

                if (response.ok) {
                    if (data.already_submitted) {
                        document.body.innerHTML = `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md text-center shadow-2xl">
                                <h2 class="text-xl font-bold text-emerald-400 mb-2">✅ Təklifiniz artıq qəbul edilib!</h2>
                                <p class="text-slate-400 text-sm">Bu sorğu üçün əvvəlcədən təklif göndərmisiniz.</p>
                            </div>
                        `;
                        return;
                    }

                    const req = data.request;
                    document.getElementById("route_text").innerText = `${req.origin} ➔ ${req.destination}`;
                    
                    let volumeText = req.volume_m3;
                    if (!volumeText || volumeText === 0 || volumeText === "0" || volumeText === 0.0 || volumeText === "Qeyd edilməyib") {
                        volumeText = "Qeyd edilməyib";
                    } else {
                        volumeText = `${volumeText} m³`;
                    }
                    document.getElementById("weight_volume_text").innerText = `${req.weight_kg || 0} kg / ${volumeText}`;
                    
                    document.getElementById("cargo_type_text").innerText = req.cargo_type || "Qeyd olunmayıb";

                    // Dəqiq dəyərlər
                    let loadingDateVal = req.loading_date || req.load_date;
                    let deadlineVal = req.deadline || req.due_date || req.end_date || req.expiry_date || req.target_date;
                    let customerNote = req.additional_notes || req.note || req.customer_note || "";

                    // Əgər loading_date yoxdursa, amma qeydlərdən tarix tapılırsa
                    if (!deadlineVal && !loadingDateVal && customerNote) {
                        const dateMatches = customerNote.match(/\d{4}-\d{2}-\d{2}/g);
                        if (dateMatches) {
                            if (dateMatches.length === 1) {
                                deadlineVal = dateMatches[0];
                            } else if (dateMatches.length > 1) {
                                loadingDateVal = dateMatches[0];
                                deadlineVal = dateMatches[1];
                            }
                        }
                    }

                    // ƏMƏLİYYAT: Əgər loading_date ilə deadline eynidirsə və ya yalnız deadline gəlibsə, loading_date-i ləğv et
                    if (loadingDateVal && deadlineVal && String(loadingDateVal).trim() === String(deadlineVal).trim()) {
                        loadingDateVal = null; // Təkrarın qarşısını alırıq
                    }

                    // 1. Loading Date göstərilməsi (Yalnız real fərqli yükləmə tarixi varsa göstər)
                    const loadingDateBox = document.getElementById("loading_date_box");
                    if (loadingDateVal && String(loadingDateVal).trim() !== "") {
                        document.getElementById("loading_date_text").innerText = String(loadingDateVal).split('T')[0];
                        loadingDateBox.classList.remove("hidden");
                    } else {
                        loadingDateBox.classList.add("hidden");
                    }

                    // 2. Deadline göstərilməsi
                    const deadlineBox = document.getElementById("deadline_box");
                    if (deadlineVal && String(deadlineVal).trim() !== "") {
                        document.getElementById("deadline_text").innerText = String(deadlineVal).split('T')[0];
                        deadlineBox.classList.remove("hidden");
                    } else {
                        deadlineBox.classList.add("hidden");
                    }

                    const fieldsList = document.getElementById("fields_list");
                    fieldsList.innerHTML = "";
                    let hasItems = false;

                    let cleanNoteLines = [];
                    if (customerNote) {
                        const lines = customerNote.split('\n');
                        lines.forEach(line => {
                            const lowLine = line.toLowerCase();
                            if (
                                lowLine.includes("volume") || 
                                lowLine.includes("cbm") || 
                                lowLine.includes("loading") || 
                                lowLine.includes("yükləmə") ||
                                lowLine.includes("yüklenme") ||
                                lowLine.includes("deadline") || 
                                lowLine.includes("due date") ||
                                lowLine.includes("tarix") ||
                                (deadlineVal && line.includes(String(deadlineVal).split('T')[0])) ||
                                (loadingDateVal && line.includes(String(loadingDateVal).split('T')[0]))
                            ) {
                                return; 
                            }
                            cleanNoteLines.push(line);
                        });
                    }
                    let finalCleanNote = cleanNoteLines.join('\n').trim();

                    if (finalCleanNote !== "") {
                        hasItems = true;
                        const noteDiv = document.createElement("div");
                        noteDiv.innerHTML = `
                            <span class="block text-xs text-slate-400 mb-1">Müştəri Qeydi:</span>
                            <div class="w-full p-3 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-200 leading-relaxed whitespace-pre-line">
                                ${finalCleanNote}
                            </div>
                        `;
                        fieldsList.appendChild(noteDiv);
                    }

                    if (req.required_fields && req.required_fields.length > 0) {
                        req.required_fields.forEach(field => {
                            if (typeof field === 'string') {
                                const lowField = field.toLowerCase();
                                if (
                                    lowField.includes("fayl") || 
                                    lowField.includes("attachment") || 
                                    field.includes("http") || 
                                    field.includes("Fayl:") || 
                                    lowField.includes("volume") || 
                                    lowField.includes("cbm") || 
                                    lowField.includes("loading") || 
                                    lowField.includes("yükləmə") ||
                                    lowField.includes("yüklenme") ||
                                    lowField.includes("deadline") || 
                                    lowField.includes("due date") ||
                                    lowField.includes("tarix") ||
                                    (deadlineVal && field.includes(String(deadlineVal).split('T')[0])) ||
                                    (loadingDateVal && field.includes(String(loadingDateVal).split('T')[0]))
                                ) {
                                    return;
                                }
                            }

                            hasItems = true;
                            const noteDiv = document.createElement("div");
                            noteDiv.innerHTML = `
                                <span class="block text-xs text-slate-400 mb-1">Müştəri Qeydi / Tələb:</span>
                                <div class="w-full p-3 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-200 leading-relaxed">
                                    ${field}
                                </div>
                            `;
                            fieldsList.appendChild(noteDiv);
                        });
                    }

                    let fileUrl = req.attachment_url;
                    if (!fileUrl && req.required_fields) {
                        const foundField = req.required_fields.find(f => typeof f === 'string' && (f.includes("Fayl:") || f.includes("http") || f.includes("uploads")));
                        if (foundField) {
                            fileUrl = foundField;
                        }
                    }

                    if (fileUrl) {
                        hasItems = true;
                        let fileName = "Əlavə Sənəd";
                        if (fileUrl.includes("Fayl:")) {
                            const parts = fileUrl.split("Fayl:");
                            if (parts[1]) fileName = parts[1].replace("]", "").trim();
                        } else if (fileUrl.includes("/")) {
                            fileName = fileUrl.split('/').pop();
                        }

                        let realHref = fileUrl.includes("http") ? fileUrl.match(/https?:\/\/[^\s]+/)[0] : `/uploads/${fileName}`;

                        const fileDiv = document.createElement("div");
                        fileDiv.innerHTML = `
                            <span class="block text-xs text-slate-400 mb-1">Müştəri Faylı:</span>
                            <div class="flex justify-between items-center bg-slate-950 px-3 py-2.5 rounded-lg border border-slate-800 text-sm">
                                <span class="text-slate-300 truncate">Sənəd / Spesifikasiya</span>
                                <a href="${realHref}" target="_blank" class="text-indigo-400 hover:text-indigo-300 underline font-medium flex items-center gap-1 text-xs">
                                    📎 <span>${fileName}</span>
                                </a>
                            </div>
                        `;
                        fieldsList.appendChild(fileDiv);
                    }

                    if (!hasItems) {
                        document.getElementById("dynamic_fields_container").style.display = "none";
                    }

                } else {
                    alert("Məlumat tapılmadı: " + (data.detail || "Xəta"));
                }
            } catch (err) {
                console.error("Xəta:", err);
            }
        }

        async function submitQuote(event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append("price", document.getElementById("price").value);
            formData.append("transit_time_days", document.getElementById("transit_time_days").value);

            const fileInput = document.getElementById("carrier_file");
            if (fileInput.files[0]) {
                formData.append("carrier_file", fileInput.files[0]);
            }

            const extraDetails = {};
            const carrierNoteVal = document.getElementById("carrier_note").value.trim();
            if (carrierNoteVal) {
                extraDetails["Daşıyıcı Qeydi"] = carrierNoteVal;
            }

            document.querySelectorAll("#fields_list input[type='text']").forEach(input => {
                const key = input.previousElementSibling ? input.previousElementSibling.innerText : "sahə";
                extraDetails[key] = input.value;
            });
            formData.append("extra_details", JSON.stringify(extraDetails));

            try {
                const response = await fetch(`/quotes/submit/${token}`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Təklifiniz uğurla göndərildi!");
                    location.reload();
                } else {
                    alert("Xəta: " + (result.detail || "Naməlum xəta"));
                }
            } catch (err) {
                console.error("Göndərmə xətası:", err);
            }
        }

        loadRequestDetails();
    </script>
