<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arachi - Submit Quote</title>
    <link rel="icon" type="image/png" href="/static/arachi-logo.png">
    <link rel="apple-touch-icon" href="/static/arachi-logo.png">
    <link rel="shortcut icon" href="/static/arachi-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
<!-- QƏTİ HƏLL: GÖZƏTÇİ SKRİPT (Kəşə qarşı) -->
    <script>
        if (window.location.search.includes('public=1') || window.location.search.includes('public_link')) {
            const observer = new MutationObserver(() => {
                const backBtn = document.querySelector('button[onclick="window.location.reload()"]');
                const altBtn = document.getElementById("submit_alt_btn");
                const optionsTabs = document.getElementById("options_tabs_container");
                const updateNotice = document.getElementById("update_notice");
                
                // O düymə və ya tablar yarandığı millisaniyədə silinir!
                if (backBtn) backBtn.remove(); 
                if (altBtn) altBtn.remove();
                if (optionsTabs) optionsTabs.remove();
                if (updateNotice) updateNotice.remove();
            });
            observer.observe(document, { childList: true, subtree: true });
        }
    </script>
    
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl p-8 shadow-2xl">
        <div class="flex items-center justify-center gap-2 mb-4">
            <img src="/static/arachi-logo.png" alt="Arachi" style="height: 28px; width: auto;">
        </div>
        <h2 class="text-2xl font-bold text-center mb-6 text-indigo-400">Carrier Quote Form</h2>

        <!-- Re-submission Notice -->
        <div id="update_notice" class="hidden bg-indigo-900/40 border border-indigo-800 text-indigo-200 p-3 rounded-lg mb-6 text-sm">
            <span class="block font-semibold mb-1">ℹ️ You have previously submitted a quote.</span>
            You can select an option below to update it OR submit a completely new alternative option.
        </div>

        <!-- Cargo Details -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-5 mb-6">
            <h3 class="text-sm font-semibold text-indigo-300 uppercase tracking-wider mb-4">📦 Cargo Details</h3>
            
            <div class="grid grid-cols-2 gap-4 text-sm mb-4">
                <div>
                    <span class="text-slate-400 block text-xs">Route</span>
                    <span id="route_text" class="font-bold text-white text-base">-</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-xs">Weight / Volume</span>
                    <span id="weight_volume_text" class="font-bold text-white text-base">-</span>
                </div>
                <div class="col-span-2">
                    <span class="text-slate-400 block text-xs">Cargo Type</span>
                    <span id="cargo_type_text" class="font-bold text-white text-base">-</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 text-sm pt-3 border-t border-slate-700/40">
                <div id="loading_date_box" class="hidden">
                    <span class="text-slate-400 block text-xs">Loading Date</span>
                    <span id="loading_date_text" class="font-bold text-white text-base">-</span>
                </div>
                <div id="deadline_box" class="hidden">
                    <span class="text-slate-400 block text-xs">Deadline</span>
                    <span id="deadline_text" class="font-bold text-white text-base">-</span>
                </div>
            </div>

            <div id="dynamic_fields_container" class="mt-4 pt-4 border-t border-slate-700/50 space-y-3">
                <h4 id="container_title" class="text-xs font-semibold text-indigo-300 uppercase tracking-wider">Customer Requirements & Notes</h4>
                <div id="fields_list" class="space-y-3"></div>
            </div>
        </div>

        <!-- Quote Form -->
        <form id="quote_form" class="space-y-4">
           
            <!-- DAŞIYICI ŞİRKƏT ADI -->
            <div id="carrierCompanyField" style="display: none;">
                <label class="block text-sm font-medium text-slate-300 mb-1">Carrier Company Name<span class="text-red-400">*</span></label>
                <input type="text" id="carrierCompanyInput" name="carrier_company" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500" placeholder="Enter your company name...">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Offered Price</label>
                <div class="flex gap-2">
                    <input type="number" step="0.01" id="price" class="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500" placeholder="0.00">
                    <select id="currency" class="w-28 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                        <option value="AZN">AZN</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="TRY">TRY</option>
                        <option value="RUB">RUB</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Transit Time (Days)</label>
                <input type="number" id="transit_time_days" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500" placeholder="e.g.: 5">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Additional Notes or Terms (From Carrier)</label>
                <textarea id="carrier_note" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500" placeholder="Payment terms, special notes or offer details..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Additional Document / File (From Carrier)</label>
                <input type="file" id="carrier_file" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
            </div>

            <div class="flex flex-col gap-3 mt-4 pt-2">
                <button type="button" id="submit_btn" onclick="setSubmitTypeAndSend(false)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition duration-200">
                    🚀 Submit Quote
                </button>
                <button type="button" id="submit_alt_btn" onclick="setSubmitTypeAndSend(true)" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg transition duration-200 shadow-lg shadow-emerald-900/20 border border-emerald-500/50">
                    ➕ Submit as New Alternative Option
                </button>
            </div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let allCarrierQuotes = [];
        let currentEditingToken = token;
        window.isPublicLink = false;

        // XSS QORUNMASI
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Tarix formatlama
        function formatDateTime(str) {
            if (!str) return "-";
            let s = String(str);
            if (s.includes("AM") || s.includes("PM")) return s;
            if (s.includes("T")) {
                let parts = s.split("T");
                let datePart = parts[0];
                let timePart = parts[1].split("+")[0].split(".")[0].split("Z")[0]; 
                let timeParts = timePart.split(":");
                if (timeParts.length >= 2) {
                    let h = parseInt(timeParts[0], 10);
                    let m = timeParts[1];
                    if (h === 0 && m === "00") return datePart;
                    let ampm = h >= 12 ? 'PM' : 'AM';
                    h = h % 12;
                    h = h ? h : 12; 
                    timePart = String(h).padStart(2, '0') + ':' + m + ' ' + ampm;
                    return datePart + " " + timePart;
                }
            }
            return s.replace(/\s00:00:00/g, '').replace(/\s00:00/g, '').trim();
        }

        function renderOptionsTabs() {
            let container = document.getElementById("options_tabs_container");
            if (!container) {
                container = document.createElement("div");
                container.id = "options_tabs_container";
                const formEl = document.getElementById("quote_form");
                formEl.parentNode.insertBefore(container, formEl);
            }

            let tabsHtml = `<div class="flex gap-2 overflow-x-auto mb-5 pb-2" style="scrollbar-width: thin; scrollbar-color: #4f46e5 transparent;">`;
            allCarrierQuotes.forEach((q, index) => {
                let isSub = q.price !== null || (q.extra_details && q.extra_details.submitted_at);
                let label = isSub ? `Option ${index + 1}` : `Draft Option`;
                let priceLabel = q.price ? `${q.price} ${q.currency}` : '';
                
                tabsHtml += `<button type="button" id="tab_${q.token}" onclick="selectQuoteOption('${q.token}')" class="px-4 py-2 text-sm font-medium rounded-lg border border-slate-700 bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white transition-all whitespace-nowrap quote-tab-btn flex flex-col items-center min-w-[100px]">
                    <span class="block">${label}</span>
                    ${priceLabel ? `<span class="text-xs text-emerald-400 font-bold mt-1">${priceLabel}</span>` : ''}
                </button>`;
            });
            tabsHtml += `</div>`;
            container.innerHTML = tabsHtml;
        }

        function selectQuoteOption(selectedToken) {
            currentEditingToken = selectedToken;
            const q = allCarrierQuotes.find(x => x.token === selectedToken);
            if (!q) return;

            document.querySelectorAll(".quote-tab-btn").forEach(btn => {
                btn.classList.remove("bg-indigo-600", "text-white", "border-indigo-500");
                btn.classList.add("bg-slate-800", "text-slate-400", "border-slate-700");
            });
            const activeTab = document.getElementById(`tab_${selectedToken}`);
            if (activeTab) {
                activeTab.classList.remove("bg-slate-800", "text-slate-400", "border-slate-700");
                activeTab.classList.add("bg-indigo-600", "text-white", "border-indigo-500");
            }

            document.getElementById("price").value = q.price !== null ? q.price : "";
            document.getElementById("currency").value = q.currency || "AZN";
            document.getElementById("transit_time_days").value = q.transit_time_days !== null ? q.transit_time_days : "";
            
            if (q.extra_details && q.extra_details["Carrier Note"]) {
                document.getElementById("carrier_note").value = q.extra_details["Carrier Note"];
            } else {
                document.getElementById("carrier_note").value = "";
            }

            let isSub = q.price !== null || (q.extra_details && q.extra_details.submitted_at);
            if (isSub) {
                document.getElementById("submit_btn").innerHTML = "🔄 Update Selected Quote";
            } else {
                document.getElementById("submit_btn").innerHTML = "🚀 Submit Quote";
            }
        }

        async function loadRequestDetails() {
            try {
                const response = await fetch(`/requests/details/${token}`);
                const data = await response.json();

                if (!response.ok) {
                    alert("Information not found: " + (data.detail || "Error"));
                    return;
                }

                const req = data.request;

                // 1. PUBLIC LİNKİN DƏQİQ AŞKARLANMASI
                if (window.location.href.includes('public=1')) window.isPublicLink = true;
                if (data.is_public === true) window.isPublicLink = true;
                if (data.quote && data.quote.carriers && data.quote.carriers.email && String(data.quote.carriers.email).includes("public_link")) window.isPublicLink = true;
                if (data.quote && data.quote.token && String(data.quote.token).includes("public_link")) window.isPublicLink = true;

                if (window.isPublicLink) {
                    // ==============================================================
                    // NÜVƏ HƏLLİ: BÜTÜN KÖHNƏ MƏLUMATLARI DOM-DAN ZORLA SİLİRİK!
                    // ==============================================================
                    
                    const field = document.getElementById('carrierCompanyField');
                    if (field) field.style.display = 'block';
                    const input = document.getElementById('carrierCompanyInput');
                    if (input) input.required = true;

                    document.getElementById("price").value = "";
                    document.getElementById("currency").value = "AZN";
                    document.getElementById("transit_time_days").value = "";
                    if (document.getElementById("carrier_note")) document.getElementById("carrier_note").value = "";
                    
                    // Tabları kökündən məhv edirik
                    const elementsToNuke = ["options_tabs_container", "update_notice", "submit_alt_btn"];
                    elementsToNuke.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            el.innerHTML = "";
                            el.style.setProperty("display", "none", "important");
                        }
                    });
                    
                    const submitBtn = document.getElementById("submit_btn");
                    if (submitBtn) submitBtn.innerHTML = "🚀 Submit Quote";
                    
                    currentEditingToken = token;

                } else {
                    // YALNIZ NORMAL (E-POÇT) LİNKLƏRİ ÜÇÜN TABLARI GÖSTƏRİRİK
                    if (data.all_quotes && data.all_quotes.length > 0) {
                        allCarrierQuotes = data.all_quotes;
                        const submittedQuotes = allCarrierQuotes.filter(q => q.price !== null || (q.extra_details && q.extra_details.submitted_at));
                        
                        if (submittedQuotes.length > 0) {
                            const notice = document.getElementById("update_notice");
                            if (notice) { notice.classList.remove("hidden"); notice.style.display = "block"; }
                            
                            const altBtn = document.getElementById("submit_alt_btn");
                            if (altBtn) { altBtn.classList.remove("hidden"); altBtn.style.display = "block"; }
                            
                            if (typeof renderOptionsTabs === "function") renderOptionsTabs();
                            
                            const defaultQuote = allCarrierQuotes.find(q => q.token === token) || allCarrierQuotes[0];
                            if (typeof selectQuoteOption === "function") selectQuoteOption(defaultQuote.token);
                        } else {
                            document.getElementById("price").value = data.quote.price || "";
                            document.getElementById("currency").value = data.quote.currency || "AZN";
                            document.getElementById("transit_time_days").value = data.quote.transit_time_days || "";
                            if (data.quote.extra_details && data.quote.extra_details["Carrier Note"]) {
                                document.getElementById("carrier_note").value = data.quote.extra_details["Carrier Note"];
                            }
                        }
                    }
                }

                // Ekrana Yük Məlumatlarının Çıxarılması
                const routeEl = document.getElementById("route_text");
                if (routeEl) routeEl.innerText = `${escapeHTML(req.origin)} ➔ ${escapeHTML(req.destination)}`;
                
                let volumeText = req.volume_m3;
                if (!volumeText || volumeText === 0 || volumeText === "0" || volumeText === 0.0 || volumeText === "Qeyd edilməyib" || volumeText === "Not specified") {
                    volumeText = "Not specified";
                } else { volumeText = `${volumeText} m³`; }
                
                const weightVolEl = document.getElementById("weight_volume_text");
                if (weightVolEl) weightVolEl.innerText = `${escapeHTML(req.weight_kg || 0)} kg / ${escapeHTML(volumeText)}`;
                
                const cargoTypeEl = document.getElementById("cargo_type_text");
                if (cargoTypeEl) cargoTypeEl.innerText = escapeHTML(req.cargo_type || "Not specified");

                let loadingDateVal = null;
                let deadlineVal = req.deadline || req.due_date || req.end_date || req.expiry_date || req.target_date;
                let customerNote = req.additional_notes || req.note || req.customer_note || "";

                if (req.required_fields && req.required_fields.length > 0) {
                    req.required_fields.forEach(field => {
                        if (typeof field === 'string') {
                            const lowerField = field.toLowerCase();
                            if (lowerField.includes("loading") || lowerField.includes("yükləmə")) {
                                const match = field.match(/\d{4}-\d{2}-\d{2}.*/);
                                if (match) loadingDateVal = match[0].trim();
                            }
                            if (lowerField.includes("deadline") || lowerField.includes("deadl")) {
                                const match = field.match(/\d{4}-\d{2}-\d{2}.*/);
                                if (match) deadlineVal = match[0].trim();
                            }
                        }
                    });
                }

                if (!loadingDateVal && deadlineVal) { loadingDateVal = deadlineVal; }

                const loadingDateBox = document.getElementById("loading_date_box");
                const loadingDateText = document.getElementById("loading_date_text");
                if (loadingDateVal && String(loadingDateVal).trim() !== "") {
                    if (loadingDateText) loadingDateText.innerText = formatDateTime(loadingDateVal);
                    if (loadingDateBox) loadingDateBox.classList.remove("hidden");
                } else { if (loadingDateBox) loadingDateBox.classList.add("hidden"); }

                const deadlineBox = document.getElementById("deadline_box");
                const deadlineText = document.getElementById("deadline_text");
                if (deadlineVal && String(deadlineVal).trim() !== "") {
                    if (deadlineText) deadlineText.innerText = formatDateTime(deadlineVal);
                    if (deadlineBox) deadlineBox.classList.remove("hidden");
                } else { if (deadlineBox) deadlineBox.classList.add("hidden"); }

                const fieldsList = document.getElementById("fields_list");
                if (fieldsList) {
                    fieldsList.innerHTML = "";
                    let hasItems = false;
                    let cleanNoteLines = [];
                    if (customerNote) { customerNote.split('\n').forEach(line => cleanNoteLines.push(line)); }
                    let finalCleanNote = cleanNoteLines.join('\n').trim();

                    if (finalCleanNote !== "") {
                        hasItems = true;
                        const noteDiv = document.createElement("div");
                        noteDiv.innerHTML = `<span class="block text-xs text-slate-400 mb-1">Customer Note:</span><div class="w-full p-3 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-200 leading-relaxed whitespace-pre-line">${escapeHTML(finalCleanNote)}</div>`;
                        fieldsList.appendChild(noteDiv);
                    }

                    if (req.required_fields && req.required_fields.length > 0) {
                        req.required_fields.forEach(field => {
                            if (typeof field === 'string') {
                                const lowField = field.toLowerCase();
                                if (lowField.includes("loading") || lowField.includes("deadline") || lowField.includes("deadl") || lowField.includes("fayl") || lowField.includes("attachment") || field.includes("http") || field.includes("Fayl:")) return;
                            }
                            hasItems = true;
                            const noteDiv = document.createElement("div");
                            noteDiv.innerHTML = `<span class="block text-xs text-slate-400 mb-1">Customer Note / Requirement:</span><div class="w-full p-3 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-200 leading-relaxed">${escapeHTML(field)}</div>`;
                            fieldsList.appendChild(noteDiv);
                        });
                    }

                    let fileUrl = req.attachment_url;
                    if (!fileUrl && req.required_fields) {
                        const foundField = req.required_fields.find(f => typeof f === 'string' && (f.includes("Fayl:") || f.includes("http") || f.includes("uploads")));
                        if (foundField) fileUrl = foundField;
                    }

                    if (fileUrl) {
                        hasItems = true;
                        let fileName = "Additional Document";
                        if (fileUrl.includes("Fayl:")) {
                            const parts = fileUrl.split("Fayl:");
                            if (parts[1]) fileName = parts[1].replace("]", "").trim();
                        } else if (fileUrl.includes("/")) { fileName = fileUrl.split('/').pop(); }

                        let realHref = fileUrl.includes("http") ? fileUrl.match(/https?:\/\/[^\s]+/)[0] : `/uploads/${fileName}`;

                        const fileDiv = document.createElement("div");
                        fileDiv.innerHTML = `<span class="block text-xs text-slate-400 mb-1">Customer File:</span><div class="flex justify-between items-center bg-slate-950 px-3 py-2.5 rounded-lg border border-slate-800 text-sm"><span class="text-slate-300 truncate">Document / Specification</span><a href="${escapeHTML(realHref)}" target="_blank" class="text-indigo-400 hover:text-indigo-300 underline font-medium flex items-center gap-1 text-xs">📎 <span>${escapeHTML(fileName)}</span></a></div>`;
                        fieldsList.appendChild(fileDiv);
                    }

                    if (!hasItems) {
                        const container = document.getElementById("dynamic_fields_container");
                        if (container) container.style.display = "none";
                    }
                }
            } catch (err) {
                console.error("Error:", err);
            }
        }

        // BU FUNKSİYA ARTIQ YALNIZ 1 DƏFƏ YAZILIB
        async function setSubmitTypeAndSend(isAlternative) {
            const formData = new FormData();
            const priceEl = document.getElementById("price");
            const currencyEl = document.getElementById("currency");
            const transitEl = document.getElementById("transit_time_days");
            
            if (priceEl && priceEl.value.trim() !== "") {
                formData.append("price", priceEl.value);
                formData.append("currency", currencyEl ? currencyEl.value : "AZN");
            }
            if (transitEl && transitEl.value.trim() !== "") {
                formData.append("transit_time_days", transitEl.value);
            }

            const fileInput = document.getElementById("carrier_file");
            if (fileInput && fileInput.files && fileInput.files[0]) { formData.append("carrier_file", fileInput.files[0]); }

            const extraDetails = {};
            const carrierNoteEl = document.getElementById("carrier_note");
            if (carrierNoteEl && carrierNoteEl.value.trim()) { extraDetails["Carrier Note"] = carrierNoteEl.value.trim(); }

            document.querySelectorAll("#fields_list input[type='text']").forEach(input => {
                const key = input.previousElementSibling ? input.previousElementSibling.innerText : "field";
                extraDetails[key] = input.value;
            });
            
            // Daşıyıcı Şirkət Adı
            const carrierCompanyInput = document.getElementById("carrierCompanyInput");
            if (carrierCompanyInput && carrierCompanyInput.value.trim() !== "") {
                formData.append("carrier_company", carrierCompanyInput.value.trim());
            }
            
            formData.append("extra_details", JSON.stringify(extraDetails));
            formData.append("is_alternative", isAlternative ? "true" : "false");

            try {
                const response = await fetch(`/quotes/submit/${currentEditingToken}`, { method: "POST", body: formData });
                let result = {};
                try { result = await response.json(); } catch (e) {}

                if (response.ok) {
                    // Dəqiq Public Link yoxlanışı
                    const isPublicLink = window.location.href.includes('public=1') || 
                                         window.location.href.includes('public_link') || 
                                         String(currentEditingToken).includes('public_link');
                    
                    // Public-dirsə düymənin HTML-i BOMBОŞ olacaq, yəni heç yaranmayacaq
                    const backButtonHTML = isPublicLink 
                        ? "" 
                        : `<button onclick="window.location.reload()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg font-medium mt-6 transition duration-200">⬅ Go Back / Submit Another Option</button>`;
                    
                    document.body.innerHTML = `
                    <div class="min-h-screen bg-slate-950 flex items-center justify-center p-4 w-full h-full absolute top-0 left-0 z-50">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md text-center shadow-2xl mx-auto">
                            <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">✓</div>
                            <h2 class="text-xl font-bold text-white mb-2">Your quote has been successfully submitted!</h2>
                            <p class="text-slate-400 text-sm mb-6">Your details have been recorded in the system. Thank you!</p>
                            ${backButtonHTML}
                        </div>
                    </div>
                    `;
                } else {
                    alert("Error: " + (result.detail || "An unknown error occurred."));
                }
            } catch (err) {
                console.error("Submission error:", err);
                alert("Could not connect to the server. Please check your internet connection.");
            }
        }
        loadRequestDetails();
    </script>
    
    <!-- PUBLIC LİNK MÜHAFİZƏSİ (Zorla Təmizləyici Kəş üçün) -->
    <script>
        if (window.location.href.includes('public=1') || window.location.href.includes('public_link')) {
            const style = document.createElement('style');
            
            // ƏN GÜCLÜ HƏLL: O inadkar "Go Back" düyməsini (onclick parametrindən) tapıb kökündən yox edirik!
            style.innerHTML = `
                #options_tabs_container, 
                #options_tabs,
                #update_notice, 
                #submit_alt_btn,
                button[onclick="window.location.reload()"] { 
                    display: none !important; 
                    pointer-events: none !important; 
                    visibility: hidden !important;
                    height: 0 !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    opacity: 0 !important;
                }
            `;
            document.head.appendChild(style);

            let clearAttempts = 0;
            const forceClear = setInterval(() => {
                const priceEl = document.getElementById("price");
                if (priceEl && priceEl.value) priceEl.value = "";
                
                const transitEl = document.getElementById("transit_time_days");
                if (transitEl && transitEl.value) transitEl.value = "";
                
                const btn = document.getElementById("submit_btn");
                if (btn && btn.innerText.includes("Update")) btn.innerText = "🚀 Submit Quote";
                
                clearAttempts++;
                if (clearAttempts > 15) clearInterval(forceClear);
            }, 100);
        }
    </script>
</body>
</html>
