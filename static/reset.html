<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni şifrə | Arachi</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="/static/arachi-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #0037B8; --brand-2: #2F63E0; --line: #DCE4F7; --text: #0B1433; --muted: #56627F; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 24px 12px;
            background: radial-gradient(900px 480px at 100% -10%, rgba(77, 124, 242, 0.12), transparent 65%), #F6F8FE;
        }
        .card-box { background: #fff; border-radius: 26px; padding: 36px; width: 100%; max-width: 480px; border: 1px solid var(--line); box-shadow: 0 30px 60px -36px rgba(0, 55, 184, 0.5); }
        .logo { height: 44px; width: 44px; object-fit: cover; border-radius: 13px; }
        .form-label { font-weight: 600; font-size: 13px; }
        .form-control { padding: 11px 14px; border-radius: 13px; border: 1px solid var(--line); background: #F8FAFF; font-size: 14px; font-weight: 500; }
        .form-control:focus { background: #fff; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(0, 55, 184, 0.10); }
        .btn-primary { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); border: none; padding: 13px; border-radius: 14px; font-weight: 700; }
        .btn-primary:disabled { background: linear-gradient(135deg, #7F96D6, #9AB0EA); }
        @media (max-width: 576px) { .card-box { padding: 24px 18px; border-radius: 22px; } }
    </style>
</head>
<body>
    <div class="card-box">
        <div class="text-center mb-4">
            <img src="/static/arachi-logo.png" alt="Arachi" class="logo" onerror="this.style.display='none'">
            <h4 class="fw-bold mt-3 mb-1">Yeni şifrə təyin edin</h4>
            <p class="text-muted small mb-0">Təhlükəsizlik üçün yeni şifrədən sonra bütün açıq sessiyalar bağlanacaq.</p>
        </div>

        <input type="hidden" id="token" value="{{ token }}">
        <div id="loading" class="text-center text-muted small">Link yoxlanılır...</div>
        <div id="invalid" class="d-none">
            <div class="alert alert-danger small">Bu link etibarsızdır, istifadə edilib və ya müddəti bitib.</div>
            <a href="/forgot-password" class="btn btn-primary w-100">Yeni bərpa linki istə</a>
        </div>

        <form id="resetForm" class="d-none" onsubmit="submitReset(event)" novalidate>
            <div class="mb-3">
                <label class="form-label" for="password">Yeni şifrə</label>
                <input type="password" class="form-control" id="password" required autocomplete="new-password" placeholder="••••••••">
                <small class="text-secondary d-block mt-2" style="font-size: 11px;"><strong>Tələb olunur:</strong> ən azı 8 simvol, 1 böyük hərf, 1 kiçik hərf və 1 rəqəm.</small>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password2">Şifrəni təkrar yazın</label>
                <input type="password" class="form-control" id="password2" required autocomplete="new-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Şifrəni yenilə</button>
            <div id="errorMsg" class="text-danger small mt-3 text-center d-none"></div>
        </form>

        <div id="done" class="d-none text-center">
            <div class="alert alert-success small">Şifrəniz yeniləndi.</div>
            <a href="/login" class="btn btn-primary w-100">Daxil ol</a>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        let token = ($('token').value || '').trim();
        if (token.indexOf('{{') !== -1) token = '';
        if (!token) { try { token = new URLSearchParams(location.search).get('token') || ''; } catch (e) {} }

        function showInvalid() { $('loading').classList.add('d-none'); $('invalid').classList.remove('d-none'); }

        async function checkToken() {
            if (!token) { showInvalid(); return; }
            try {
                const res = await fetch('/api/auth/reset-check?token=' + encodeURIComponent(token));
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.valid) { showInvalid(); return; }
                $('loading').classList.add('d-none');
                $('resetForm').classList.remove('d-none');
            } catch (e) { showInvalid(); }
        }

        async function submitReset(e) {
            e.preventDefault();
            const btn = $('submitBtn'), err = $('errorMsg');
            const fail = m => { err.textContent = m; err.classList.remove('d-none'); btn.disabled = false; btn.textContent = 'Şifrəni yenilə'; };
            const p1 = $('password').value, p2 = $('password2').value;
            if (!/^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/.test(p1)) { fail('Şifrə ən azı 8 simvol, 1 böyük hərf, 1 kiçik hərf və 1 rəqəm olmalıdır.'); return; }
            if (p1 !== p2) { fail('Şifrələr eyni deyil.'); return; }
            btn.disabled = true; btn.textContent = 'Gözləyin...'; err.classList.add('d-none');
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: p1 })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    try { localStorage.clear(); sessionStorage.clear(); } catch (e3) {}
                    $('resetForm').classList.add('d-none');
                    $('done').classList.remove('d-none');
                } else {
                    fail(typeof data.detail === 'string' ? data.detail : 'Xəta baş verdi.');
                }
            } catch (e2) { fail('Sistemlə əlaqə kəsildi. İnterneti yoxlayın.'); }
        }

        checkToken();
    </script>
</body>
</html>
