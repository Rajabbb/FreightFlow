<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arachi - Giriş</title>
    <link rel="icon" type="image/png" href="/static/arachi-logo.png">
    <link rel="apple-touch-icon" href="/static/arachi-logo.png">
    <link rel="shortcut icon" href="/static/arachi-logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <!-- Logo / Title -->
        <div class="text-center mb-8">
            <img src="/static/arachi-logo.png" alt="arachi" class="mx-auto mb-2" style="height: 48px; width: auto;">
            <p class="text-gray-500 text-sm mt-1">Müştəri Giriş Paneli</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="email">E-poçt</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="E-poçtunuzu daxil edin">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="password">Şifrə</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="••••••••">
            </div>

            <!-- Error Message Box -->
            <div id="errorMessage" class="hidden bg-red-50 border-l-4 border-red-500 p-3 text-red-700 text-sm rounded"></div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transition duration-200">
                Daxil ol
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            // Xəta sətrini təmizlə
            errorDiv.classList.add('hidden');
            errorDiv.textContent = '';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Köhnə sessiya qalıntılarını təmizləyirik
                    localStorage.clear();

                    // Yeni istifadəçi məlumatlarını localStorage-ə yazırıq
                    localStorage.setItem('user', JSON.stringify(result.user));
                    localStorage.setItem('role', result.role);
                    
                    if (result.user && result.user.id) {
                        localStorage.setItem('customer_id', result.user.id);
                    }

                    // Uğurlu giriş zamanı customer səhifəsinə yönləndiririk
                    window.location.href = '/customer';
                } else {
                    // Backend-dən gələn xəta mesajını göstər
                    errorDiv.textContent = result.detail || "E-poçt və ya şifrə yanlışdır.";
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = "Serverlə əlaqə zamanı xəta baş verdi.";
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
