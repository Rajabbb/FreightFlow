<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - LogiFast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px;
        }
        .icon-box {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: white;
            font-size: 26px;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.25);
        }
        .form-control {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            background-color: #fafafa;
        }
        .form-control:focus {
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            border-color: #3b82f6;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.25);
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
        }
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .text-muted {
            color: #64748b !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark mb-1" style="font-size: 22px;">Müştəri Girişi</h3>
            <p class="text-muted small">Sistemə daxil olmaq üçün qeydiyyatlı e-poçtunuzu daxil edin</p>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label for="email" class="form-label">E-poçt ünvanı</label>
                <div class="input-group">
                    <input type="email" class="form-control" id="email" required placeholder="ornek@sirket.az">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                Daxil ol <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="text-muted text-decoration-none small">← Əsas səhifəyə qayıt</a>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;

            try {
                const res = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem("user", JSON.stringify(data.user));
                    
                    if (data.role === "customer") {
                        window.location.replace("/customer");
                    } else if (data.role === "carrier") {
                        alert("Daşıyıcılar sistemə paneldən deyil, yalnız e-poçtlarına göndərilən xüsusi təklif linki vasitəsilə daxil ola bilərlər!");
                    } else {
                        window.location.replace("/");
                    }
                } else {
                    alert(data.detail || "Bu e-poçt ilə giriş icazəsi tapılmadı!");
                }
            } catch (err) {
                console.error("Xəta:", err);
                alert("Serverlə əlaqə qurulmadı!");
            }
        }
    </script>
</body>
</html>
