<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat - Arachi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2e8f0 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="text-center mb-4">
            <img src="/static/arachi-logo.png" alt="Arachi" height="40">
            <h4 class="fw-bold text-dark mt-3">Hesabınızı Yaradın</h4>
            <p class="text-muted small">Təhlükəsiz qeydiyyat paneli</p>
        </div>

        <form id="registerForm" onsubmit="submitRegistration(event)">
            <!-- Tokeni URL-dən alıb gizli şəkildə saxlayırıq -->
            <input type="hidden" id="token" value="{{ token }}">
            
            <div class="mb-3">
                <label class="form-label text-muted fw-bold small">Şirkətin Adı</label>
                <input type="text" class="form-control" id="company_name" required placeholder="Məs: Arachi Logistics">
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted fw-bold small">E-poçt (Giriş üçün)</label>
                <input type="email" class="form-control" id="email" required placeholder="info@shirketiniz.com">
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted fw-bold small">Şifrə təyin edin</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••">
                <small class="text-success" style="font-size: 11px;">Şifrəniz xüsusi alqoritmlə (Hash) qorunur və bizim tərəfimizdən görülə bilməz.</small>
            </div>
            
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Qeydiyyatı Tamamla</button>
            <div id="errorMsg" class="text-danger small mt-3 text-center d-none"></div>
        </form>
    </div>

    <script>
        async function submitRegistration(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.innerText = "Gözləyin...";
            errorMsg.classList.add('d-none');

            const payload = {
                token: document.getElementById('token').value,
                company_name: document.getElementById('company_name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    alert("Hesabınız uğurla yaradıldı! İndi daxil ola bilərsiniz.");
                    window.location.href = "/login"; // Qeydiyyatdan sonra loginə yönləndir
                } else {
                    errorMsg.innerText = data.detail || "Xəta baş verdi";
                    errorMsg.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerText = "Qeydiyyatı Tamamla";
                }
            } catch (err) {
                errorMsg.innerText = "Sistemlə əlaqə kəsildi.";
                errorMsg.classList.remove('d-none');
                btn.disabled = false;
                btn.innerText = "Qeydiyyatı Tamamla";
            }
        }
    </script>
</body>
</html>
